name: Promote to prod

on:
  repository_dispatch:
    types: [promote]

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          path: staging

      - name: Checkout prod
        uses: actions/checkout@v4
        with:
          repository: ViritasOrg/peptidetracker
          token: ${{ secrets.PROMOTE_TOKEN }}
          path: prod

      - name: Sync files into prod branch
        run: |
          cd prod
          git config user.name "staging-promote-bot"
          git config user.email "actions@github.com"
          BRANCH="promote/staging-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          git checkout -b "$BRANCH"

          # Copy index.html from staging
          cp ../staging/index.html ./index.html

          # Copy every JS module the page actually loads, derived from index.html's own
          # <script src> tags.
          #
          # This used to be `cp ../staging/tab-*.js` — a hardcoded glob. inj-writer.js
          # arrived in Phase 3 as a root-level module that is not tab-*.js, so the
          # promotion silently left it behind while copying the tests that read it.
          # Prod CI then failed on the first Push to Prod after the rewrite with
          #   ENOENT: no such file or directory, open '.../inj-writer.js'
          # (2026-08-20, prod PR #324). A manifest that has to be remembered will be
          # forgotten; index.html already knows the answer, so ask it.
          MODULES=$(grep -o 'src="[A-Za-z0-9._-]*\.js' ../staging/index.html \
                    | sed 's/^src="//' | sort -u)
          echo "Modules to sync:"; echo "$MODULES" | sed 's/^/  /'
          for f in $MODULES; do
            if [ -f "../staging/$f" ]; then
              cp "../staging/$f" ./
            else
              echo "::error::index.html loads $f but staging has no such file"
              exit 1
            fi
          done

          # Copy CI workflow and test suite — they must stay in sync with the code
          # (version-bump.yml, promote-to-prod.yml, version.json, CLAUDE.md are prod-owned)
          cp ../staging/.github/workflows/ci.yml .github/workflows/ci.yml
          cp -r ../staging/tests .

          # Copy web app manifest, icons, and CSS
          [ -f ../staging/manifest.json ] && cp ../staging/manifest.json ./
          for f in ../staging/*-icon.png; do [ -f "$f" ] && cp "$f" ./; done
          [ -d ../staging/css ] && cp -r ../staging/css ./

          # Reset VERSION and ?v= cache-bust strings to prod's current version so
          # const VERSION, version.json, and tab script src tags all stay in sync
          # (staging has its own independent version counter)
          PROD_VERSION=$(jq -r '.version' version.json)
          sed -i "s/const VERSION='[0-9.]*'/const VERSION='${PROD_VERSION}'/" index.html
          sed -i "s/\.js?v=[0-9.]*/.js?v=${PROD_VERSION}/g" index.html

          # Refuse to promote a prod tree that cannot load. Cheap, and it turns the
          # class of failure above into a clear message here instead of a red CI run
          # on a PR already open against prod.
          MISSING=""
          for f in $(grep -o 'src="[A-Za-z0-9._-]*\.js' index.html | sed 's/^src="//' | sort -u); do
            [ -f "./$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::prod would be missing modules index.html loads:$MISSING"
            exit 1
          fi

          if git diff --quiet && git diff --staged --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to promote"
            exit 0
          fi

          git add -A
          git commit -m "Promote staging changes (${GITHUB_SHA::7})"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Open PR on prod
        if: env.BRANCH != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ViritasOrg/peptidetracker/pulls \
            -d "{\"title\":\"Promote staging changes (${GITHUB_SHA::7})\",\"head\":\"$BRANCH\",\"base\":\"main\",\"body\":\"Auto-generated PR from peptidetracker-staging@main (${GITHUB_SHA}), triggered via Push to Prod.\"}")
          PR_URL=$(echo "$RESPONSE" | jq -r '.html_url')
          PR_NODE_ID=$(echo "$RESPONSE" | jq -r '.node_id')
          PR_NUMBER=$(echo "$RESPONSE" | jq -r '.number')
          if [ "$PR_URL" = "null" ] || [ -z "$PR_URL" ]; then
            echo "PR creation failed: $RESPONSE"
            exit 1
          fi
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"
          echo "PR_NODE_ID=$PR_NODE_ID" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Wait for CI and merge prod PR
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          REPO="ViritasOrg/peptidetracker"
          echo "Waiting for CI on PR #$PR_NUMBER then merging..."
          for i in $(seq 1 60); do
            PR_DATA=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '{merged: .merged, state: .state, sha: .head.sha}')
            MERGED=$(echo "$PR_DATA" | jq -r '.merged')
            STATE=$(echo "$PR_DATA" | jq -r '.state')
            SHA=$(echo "$PR_DATA" | jq -r '.sha')
            if [ "$MERGED" = "true" ]; then
              echo "PR #$PR_NUMBER merged (attempt $i)"
              exit 0
            elif [ "$STATE" = "closed" ]; then
              echo "PR #$PR_NUMBER closed without merging — CI failed on prod"
              exit 1
            fi
            RUNS=$(gh api repos/$REPO/commits/$SHA/check-runs)
            # Gate on THIS repo's own CI job only. The gate used to fail if ANY check
            # on the commit was failed/cancelled, which meant a scanner the repo does
            # not control could block a deploy: moving to the ViritasOrg org turned on
            # CodeQL by default, and it flagged three pre-existing findings in code
            # that was already live in prod. A security finding belongs in the Security
            # tab where it gets triaged — it is not a reason to refuse to ship, and a
            # cancelled Pages build (which a visibility change causes) is not either.
            # Test failures still block, exactly as before.
            CI=$(echo "$RUNS" | jq '[.check_runs[] | select(.name == "test")]')
            TOTAL=$(echo "$CI" | jq 'length')
            # Non-blocking, but never silent: surface anything else that went red.
            OTHER=$(echo "$RUNS" | jq -r '[.check_runs[] | select(.name != "test") | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join(", ")')
            if [ -n "$OTHER" ]; then echo "Note: non-blocking checks not passing: $OTHER"; fi
            if [ "$TOTAL" = "0" ]; then
              echo "Attempt $i: no CI checks yet, waiting 10s..."
              sleep 10
              continue
            fi
            FAILED=$(echo "$CI" | jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled")] | length')
            PENDING=$(echo "$CI" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$FAILED" -gt "0" ]; then
              echo "CI failed on prod PR #$PR_NUMBER ($FAILED failed checks)"
              exit 1
            fi
            if [ "$PENDING" = "0" ]; then
              echo "All CI checks passed (attempt $i). Merging PR #$PR_NUMBER..."
              gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
              exit 0
            fi
            echo "Attempt $i: $PENDING CI check(s) still running, waiting 10s..."
            sleep 10
          done
          echo "Timeout: PR #$PR_NUMBER did not merge within 10 minutes"
          exit 1
